name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Verify package build
        run: uv build

      - name: Lint V2 package and version test
        run: uv run --no-sync ruff check src/auth src/lxl_quantaxis tests/core tests/security tests/test_version.py

      - name: Check formatting
        run: uv run --no-sync ruff format --check src/auth src/lxl_quantaxis tests/core tests/security tests/test_version.py

      - name: Type-check V2 package
        run: uv run --no-sync mypy src/lxl_quantaxis

      - name: Scan V2 package for security issues
        run: uv run --no-sync bandit -q -r src/auth src/lxl_quantaxis

      - name: Run regression suite
        run: uv run --no-sync python -m unittest discover -s tests -v
