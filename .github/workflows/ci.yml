name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[realtime]"
          pip install pytest ruff bandit
        shell: bash

      - name: Verify package import
        run: python -c "import src.lxl_quantaxis; print('V2 package OK')"
        shell: bash

      - name: Lint V2 package (ruff)
        run: ruff check src/lxl_quantaxis/ src/auth/ --select E9,F821,F601,F811,B006
        shell: bash

      - name: Security scan (bandit)
        run: bandit -r src/lxl_quantaxis/ src/auth/ -ll -q -x tests
        shell: bash

      - name: Compile check
        run: python -m compileall -q src/
        shell: bash

      - name: Run tests (pytest)
        run: python -m pytest tests/ -q --tb=short
        shell: bash
