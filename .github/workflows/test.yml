name: test

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[realtime]"
          pip install pytest ruff bandit

      - name: Verify import
        run: python -c "import src.lxl_quantaxis; print('Import OK')"

      - name: Lint (ruff)
        run: python -m ruff check src/lxl_quantaxis/ src/auth/ --select E9,F821,F601,F811,B006

      - name: Security scan (bandit)
        run: python -m bandit -r src/lxl_quantaxis/ src/auth/ -ll -q -x tests

      - name: Compile check
        run: python -m compileall -q src/

      - name: Tests
        run: python -m pytest tests/ -q --tb=short
