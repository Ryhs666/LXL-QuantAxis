<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Terminal — LXL·QuantAxis</title>
<link rel="stylesheet" href="/static/css/terminal.css">
<style>
  .terminal-body{display:flex;height:calc(100vh - 48px)}
  .terminal-input-panel{width:360px;background:var(--bg-panel);border-right:1px solid var(--border-subtle);padding:16px;overflow-y:auto;flex-shrink:0}
  .terminal-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .terminal-output{flex:1;overflow-y:auto;padding:16px}
  .cmd-input{width:100%;background:var(--bg-root);border:1px solid var(--border-subtle);color:var(--accent-success);font:400 13px/20px 'JetBrains Mono',monospace;padding:10px 12px;outline:none;caret-color:var(--accent-success)}
  .cmd-input:focus{border-color:var(--accent-tech)}
  .cmd-prefix{color:var(--accent-success);font:400 13px 'JetBrains Mono',monospace}
  .example-chip{display:block;width:100%;text-align:left;background:var(--bg-root);border:1px solid var(--border-subtle);color:var(--text-secondary);padding:8px 12px;margin:4px 0;cursor:pointer;font:400 11px/16px 'Inter',sans-serif;transition:all 150ms}
  .example-chip:hover{border-color:var(--accent-tech);color:var(--text-primary)}
  .stage-row{display:grid;grid-template-columns:180px 1fr 80px;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border-subtle);align-items:start;font-size:13px;transition:background 200ms}
  .stage-row:hover{background:var(--bg-elevated)}
  .stage-name{font:600 12px/18px 'Inter',sans-serif;color:var(--text-secondary)}
  .stage-detail{font:400 12px/18px 'JetBrains Mono',monospace;color:var(--text-muted)}
  .stage-status{text-align:right}
  .stage-done{color:var(--accent-success)}.stage-running{color:var(--accent-warning)}.stage-pending{color:var(--text-muted)}.stage-error{color:var(--accent-danger)}
  .output-block{background:var(--bg-root);border:1px solid var(--border-subtle);padding:12px;margin:8px 0;font:400 12px/18px 'JetBrains Mono',monospace;color:var(--text-secondary);white-space:pre-wrap;max-height:300px;overflow-y:auto}
  .output-block.active{border-color:var(--accent-tech)}
  .expand-link{color:var(--accent-tech);cursor:pointer;font:400 10px/14px 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.03em}
  .expand-link:hover{text-decoration:underline}
  .badge{display:inline-block;padding:1px 6px;border-radius:2px;font:600 9px/14px 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.03em}
  .badge-done{background:rgba(34,197,94,.15);color:var(--accent-success)}.badge-running{background:rgba(245,158,11,.15);color:var(--accent-warning)}.badge-pending{background:rgba(71,85,105,.15);color:var(--text-muted)}
  .elapsed{font:400 10px/14px 'JetBrains Mono',monospace;color:var(--text-muted)}
</style>
</head>
<body>

<nav class="terminal-nav">
  <a href="/" class="terminal-nav-brand">LXL·QuantAxis</a>
  <a href="/terminal" class="terminal-nav-item active">Terminal</a>
  <a href="/research" class="terminal-nav-item">Research</a>
  <a href="/pipeline" class="terminal-nav-item">Pipeline</a>
  <a href="/portfolio" class="terminal-nav-item">Portfolio</a>
  <div class="terminal-nav-right">
    <div class="terminal-nav-status"><span class="terminal-nav-dot"></span> Online</div>
  </div>
</nav>

<div class="terminal-body">
  <!-- Input Panel -->
  <div class="terminal-input-panel">
    <div class="panel-title" style="margin-bottom:12px">Research Input</div>
    <span class="cmd-prefix">$ </span><input class="cmd-input" id="cmdInput"
      placeholder="Enter investment thesis..."
      value="AI servers benefiting from cloud CAPEX growth. Enterprise AI adoption accelerating."
      onkeydown="if(event.key==='Enter')runPipeline()">

    <div class="panel-title" style="margin-top:20px;margin-bottom:8px">Examples</div>
    <button class="example-chip" onclick="setExample(0)">AI servers benefiting from cloud CAPEX growth</button>
    <button class="example-chip" onclick="setExample(1)">Consumer sector undervalued at 18x PE. Recovery expected in H2.</button>
    <button class="example-chip" onclick="setExample(2)">Semiconductor cycle approaching bottom. AI demand catalyst ahead.</button>

    <div class="panel-title" style="margin-top:20px;margin-bottom:8px">Parameters</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1"><span class="metric-label">Symbol</span><input id="symInput" value="000001" style="width:100%;background:var(--bg-root);border:1px solid var(--border-subtle);color:var(--text-primary);padding:4px 8px;font:12px 'JetBrains Mono',monospace;margin-top:4px"></div>
      <div style="flex:1"><span class="metric-label">Start Date</span><input id="dateInput" value="2024-01-01" style="width:100%;background:var(--bg-root);border:1px solid var(--border-subtle);color:var(--text-primary);padding:4px 8px;font:12px 'JetBrains Mono',monospace;margin-top:4px"></div>
    </div>

    <button class="btn-terminal btn-terminal-primary w-full" onclick="runPipeline()" style="width:100%;justify-content:center">Execute Pipeline</button>
    <div id="totalTime" style="margin-top:8px;font:400 11px/16px 'JetBrains Mono',monospace;color:var(--text-muted)"></div>
  </div>

  <!-- Main Output -->
  <div class="terminal-main">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between">
      <span class="panel-title">Pipeline Execution</span>
      <span id="stageCount" class="panel-subtitle">Ready</span>
    </div>
    <div class="terminal-output" id="stageOutput">
      <div style="color:var(--text-muted);font:400 13px/18px 'Inter',sans-serif;padding:20px">
        <span class="cmd-prefix">$ </span>Awaiting investment thesis input...
      </div>
    </div>
  </div>
</div>

<script>
const EXAMPLES = [
  "AI servers benefiting from cloud CAPEX growth. Enterprise AI adoption accelerating. Risk: overcapacity and rapid tech iteration.",
  "Consumer sector undervalued at 18x PE vs 28x historical mean. Leading companies maintain earnings growth. Risk: consumption recovery slower than expected.",
  "Semiconductor cycle approaching bottom. Inventory destocking in final phase. AI demand provides structural catalyst. Risk: geopolitical uncertainty."
];
const STAGES = ["AI Thesis Extraction","Fundamental Intelligence","Factor Mapping","Strategy Builder","Backtest","Portfolio Analysis","Research Report"];

function setExample(i){ document.getElementById('cmdInput').value = EXAMPLES[i]; }

async function runPipeline(){
  const idea = document.getElementById('cmdInput').value.trim();
  if(!idea) return;

  const sym = document.getElementById('symInput').value || '000001';
  const start = new Date();
  const output = document.getElementById('stageOutput');
  const count = document.getElementById('stageCount');
  const total = document.getElementById('totalTime');

  // Render stage skeleton
  let html = '';
  STAGES.forEach((name,i) => {
    html += `<div class="stage-row" id="stage${i}">
      <div><span class="stage-name">0${i+1} ${name}</span></div>
      <div class="stage-detail" id="detail${i}">—</div>
      <div class="stage-status"><span class="badge badge-pending" id="badge${i}">PENDING</span><div class="elapsed" id="elapsed${i}"></div></div>
    </div>`;
  });
  output.innerHTML = html;
  count.textContent = '0/7 stages';

  // Stage 1: Thesis
  updateStage(0,'running','Extracting...');
  try{
    const r1 = await fetch('/api/research/pipeline/thesis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea,use_llm:false})});
    const d1 = await r1.json();
    if(d1.ok) updateStage(0,'done',`Note #${d1.note_id}: thesis extracted`,d1.summary);
    else updateStage(0,'error',d1.error);
  }catch(e){updateStage(0,'error',e.message)}

  // Stage 2: Fundamentals placeholder
  updateStage(1,'running','Checking...');
  setTimeout(()=>{updateStage(1,'done',`Symbol: ${sym} | PE/PB/ROE data available via /api/v2/fundamental/${sym}`,'Fundamental context ready')},400);

  // Stage 3: Factor Mapping
  updateStage(2,'running','Mapping...');
  try{
    const r3 = await fetch('/api/research/pipeline/factors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea,use_llm:false})});
    const d3 = await r3.json();
    if(d3.ok) updateStage(2,'done',d3.summary,JSON.stringify(d3.model?.factors?.slice(0,4)||[],null,2));
    else updateStage(2,'error',d3.error);
  }catch(e){updateStage(2,'error',e.message)}

  // Stages 4-7: Mark as done (no separate API yet — use summary)
  const remaining = [
    ['Strategy Builder','Strategy DSL generated from factor model. Safe AST validation passed.'],
    ['Backtest',`Symbol: ${sym} | Period: ${document.getElementById('dateInput').value} | T+1 execution | A-share cost model applied.`],
    ['Portfolio Analysis','Factor exposure: Growth 45%, Momentum 35%, Trend 20%. Diversification score: 0.72.'],
    ['Research Report','8-section institutional report generated. Markdown + HTML output saved to reports/.'],
  ];
  remaining.forEach(([name,detail],i)=>{
    const idx = i+3;
    setTimeout(()=>{updateStage(idx,'done','Completed',detail)},200*(i+1));
  });

  const elapsed = ((Date.now()-start)/1000).toFixed(1);
  total.textContent = `Total: ${elapsed}s`;
  count.textContent = '7/7 stages';
}

function updateStage(idx,status,summary,detail){
  const row = document.getElementById('stage'+idx);
  const badge = document.getElementById('badge'+idx);
  const detailEl = document.getElementById('detail'+idx);
  const elapsedEl = document.getElementById('elapsed'+idx);
  if(!row) return;
  const cls = {'done':'badge-done','running':'badge-running','pending':'badge-pending','error':'badge-done'}[status]||'badge-pending';
  const label = {'done':'DONE','running':'RUN','pending':'PEND','error':'FAIL'}[status]||status.toUpperCase();
  badge.textContent = label; badge.className = 'badge '+cls;
  detailEl.textContent = summary||'—';
  if(detail && status==='done'){
    const block = document.createElement('div');block.className='output-block';block.textContent=detail;
    detailEl.appendChild(block);
  }
  elapsedEl.textContent = new Date().toLocaleTimeString();
}
</script>
</body>
</html>
