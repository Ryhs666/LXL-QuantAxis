<!-- HTMX Partial: Active Thesis List -->
{% if items %}
  {% for t in items %}
  <div class="item-row priority-{{ 'high' if t.confidence and t.confidence >= 0.7 else 'med' if t.confidence and t.confidence >= 0.5 else 'low' }}">
    <span class="item-ticker">{{ t.ticker | join(', ') }}</span>
    <span class="item-title" title="{{ t.title }}">{{ t.title }}</span>
    <span class="tag">conf: {{ '%.0f'|format(t.confidence * 100) if t.confidence else '--' }}%</span>
    <span class="item-meta">{{ t.created_at[:10] if t.created_at else '--' }}</span>
  </div>
  {% endfor %}
{% else %}
  <div class="empty">No active theses. <a href="/journal">Create one →</a></div>
{% endif %}
