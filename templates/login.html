<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LXL·QuantAxis — 登录</title>
<style>
:root{
--bg:#0a0e17;--bg2:#111827;--bg3:#1a2332;--border:#1f2a3a;
--ac:#00d4ff;--gr:#00ff88;--rd:#ff4466;--t1:#e6edf3;--t2:#8b949e;--t3:#475569;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
background:var(--bg);color:var(--t1);min-height:100vh;display:flex;align-items:center;justify-content:center;
background:radial-gradient(ellipse at 50% 30%, #0d1a2d 0%, var(--bg) 70%);}
.login-wrap{width:420px;max-width:95vw}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:26px;font-weight:700;letter-spacing:-0.5px}
.logo h1 span{color:var(--ac)}
.logo p{font-size:11px;color:var(--t3);margin-top:4px;letter-spacing:3px;text-transform:uppercase}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px 28px}
.tabs{display:flex;margin-bottom:24px;border-bottom:2px solid var(--border)}
.tab{flex:1;text-align:center;padding:8px;font-size:13px;color:var(--t2);cursor:pointer;
border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--ac);border-bottom-color:var(--ac)}
.field{margin-bottom:16px}
.field label{display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.field input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);
border-radius:6px;color:var(--t1);font-size:13px;outline:none;transition:border .2s}
.field input:focus{border-color:var(--ac)}
.btn{width:100%;padding:11px;border:none;border-radius:6px;font-size:13px;font-weight:600;
cursor:pointer;transition:all .2s;letter-spacing:0.5px}
.btn-primary{background:var(--ac);color:#000}
.btn-primary:hover{filter:brightness(1.2);box-shadow:0 0 20px rgba(0,212,255,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:11px;text-align:center;margin-top:14px;min-height:18px}
.msg.err{color:var(--rd)}.msg.ok{color:var(--gr)}
.footer{text-align:center;margin-top:20px;font-size:10px;color:var(--t3)}
</style>
</head>
<body>
<div class="login-wrap">
<div class="logo">
<h1>LXL<span>·</span>QuantAxis</h1>
<p>量化交易平台</p>
</div>
<div class="card">
<div class="tabs">
<div class="tab active" id="tabLogin" onclick="switchTab('login')">登 录</div>
<div class="tab" id="tabRegister" onclick="switchTab('register')">注 册</div>
</div>
<div class="field"><label>用户名</label><input id="username" placeholder="输入用户名" autocomplete="off"></div>
<div class="field"><label>密码</label><input id="password" type="password" placeholder="输入密码"></div>
<div class="field" id="emailField" style="display:none"><label>邮箱 (可选)</label><input id="email" placeholder="your@email.com"></div>
<button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">登 录</button>
<div class="msg" id="msg"></div>
</div>
<div class="footer">LXL·QuantAxis v5.2 &copy; 2026</div>
</div>
<script>
let mode='login';
function switchTab(m){
mode=m;
document.getElementById('tabLogin').classList.toggle('active',m==='login');
document.getElementById('tabRegister').classList.toggle('active',m==='register');
document.getElementById('emailField').style.display=m==='register'?'block':'none';
document.getElementById('submitBtn').textContent=m==='login'?'登 录':'注 册';
document.getElementById('msg').textContent='';document.getElementById('msg').className='msg';
}
async function handleSubmit(){
const u=document.getElementById('username').value.trim();
const p=document.getElementById('password').value;
const e=document.getElementById('email').value.trim();
const msg=document.getElementById('msg');
const btn=document.getElementById('submitBtn');
if(!u||!p){msg.textContent='请输入用户名和密码';msg.className='msg err';return}
if(mode==='register'&&p.length<8){msg.textContent='密码至少8位，且需包含字母和数字';msg.className='msg err';return}
btn.disabled=true;btn.textContent='处理中...';msg.textContent='';msg.className='msg';
try{
const endpoint=mode==='login'?'/api/login':'/api/register';
const body=mode==='login'?{username:u,password:p}:{username:u,password:p,email:e};
const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const d=await r.json();
if(!r.ok||d.error){msg.textContent=d.error||'请求失败';msg.className='msg err';btn.disabled=false;btn.textContent=mode==='login'?'登 录':'注 册';return}
if(mode==='register'){msg.textContent='注册成功！请切换到登录';msg.className='msg ok';btn.disabled=false;btn.textContent='注 册';setTimeout(()=>switchTab('login'),800);return}
// Login success
localStorage.setItem('qa_token',d.access_token);
localStorage.setItem('qa_user',JSON.stringify(d.user));
window.location.href='/game';
}catch(e){msg.textContent='网络错误: '+e.message;msg.className='msg err';btn.disabled=false;btn.textContent=mode==='login'?'登 录':'注 册';}
}
document.getElementById('password').addEventListener('keypress',e=>{if(e.key==='Enter')handleSubmit();});
document.getElementById('username').focus();
</script>
</body>
</html>
